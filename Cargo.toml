[package]
name = "codespace"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/oxidecomputer/codespace"
description = "Structural scratch space for generated Rust code"
keywords = ["codegen", "proc-macro2", "quote", "modules"]
categories = ["development-tools"]
exclude = [".github", "rust-toolchain.toml"]

[dependencies]
proc-macro2 = "1.0.104"
quote = "1.0.42"
semver = "1.0.27"
version-ranges = { version = "0.1.3", features = ["semver"] }
syn = { version = "3.0.3", default-features = false, features = ["parsing"] }
